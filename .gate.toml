# Detection has no bun audit convention; this is the shared audit-bun script CI's setup-bun run-audit runs.
[gates.vuln]
run = '[ -n "$CI" ] || bun /usr/local/src/com.github/Rethunk-Tech/gh-actions/audit-bun/audit.ts'

# CI's `bun run ci` ends with a vsce package listing, which catches a manifest or .vscodeignore that would fail
# `vsce package`. It reads the build output, so it follows the build.
[gates.build]
serial = true

[gates.vsce]
run = "bunx @vscode/vsce ls --no-dependencies >/dev/null"
serial = true

[gates.knip]
run = "bunx knip"
