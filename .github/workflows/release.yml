name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: Rethunk-Tech/gh-actions/setup-bun@67ec8bd68343d915462729ad119c355740cf6205 # v1.22
        with:
          node-version: "24"

      # `bun run ci` runs gate, which the runner does not have.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install gate
        run: |
          go install github.com/Rethunk-Tech/rethunk-gate-cli/cmd/gate@v0.6.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint, typecheck, test, build
        run: bun run ci

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: Rethunk-Tech/gh-actions/setup-bun@67ec8bd68343d915462729ad119c355740cf6205 # v1.22
        with:
          node-version: "24"

      # dist/ is not committed; this job's checkout has none until it builds.
      - name: Build
        run: bun run build

      - name: Package extension
        run: bunx @vscode/vsce package --no-dependencies

      - name: Attach .vsix to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: "*.vsix"
