name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A newer push makes the older run's verdict worthless, so it cancels that run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: Rethunk-Tech/gh-actions/setup-bun@ed6afe0e127f69c7da2c8178521fa0d049176a00 # v1.36
        with:
          node-version: "26"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false

      - name: Install gate
        run: |
          go install github.com/Rethunk-Tech/rethunk-gate-cli/cmd/gate@v0.10.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint, typecheck, test, build
        run: gate

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Bun
        uses: Rethunk-Tech/gh-actions/setup-bun@ed6afe0e127f69c7da2c8178521fa0d049176a00 # v1.36
        with:
          node-version: "26"

      # dist/ is not committed; this job's checkout has none until it builds.
      - name: Build
        run: bun run build

      - name: Package extension
        run: bunx @vscode/vsce package --no-dependencies

      - name: Attach .vsix to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: "*.vsix"
