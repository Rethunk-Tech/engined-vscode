name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
          cache: false

      - name: Install gate
        run: |
          go install github.com/Rethunk-Tech/rethunk-gate-cli/cmd/gate@v0.6.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Bun
        uses: Rethunk-Tech/gh-actions/setup-bun@79cf1f780ce44c714a6928098da557539eba150f # v1.20
        with:
          node-version: "24"

      - name: Gate
        if: ${{ !cancelled() }}
        run: gate
