name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install gate
        run: |
          go install github.com/Rethunk-Tech/rethunk-gate-cli/cmd/gate@v0.6.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Bun
        uses: Rethunk-Tech/gh-actions/setup-bun@4163d2a5a37b1538dd45926e264b3c4027b5cbaa # v1.24
        with:
          node-version: "24"

      - name: Gate
        if: ${{ !cancelled() }}
        run: gate
